name: Website CI Pipeline

on:
  workflow_call:

jobs:
  test:
    name: Test Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check website files
        run: |
          test -f websitefolder/index.html
          test -f websitefolder/style.css
          test -f websitefolder/scri.

      - name: Confirm successful validation
        run: echo "my Website validation passed!"

  upload:
    name: Upload Artifacts
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: website-artifacts
          path: websitefolder/